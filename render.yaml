services:
  - type: web
    name: heart-health-care-erp
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/heart_erp.db
    disk:
      mountPath: /data
      sizeGB: 1
