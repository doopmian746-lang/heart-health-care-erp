services:
  - type: web
    name: heart-health-care-erp
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/heart_erp.db
    disk:
      mountPath: /data
      sizeGB: 1
